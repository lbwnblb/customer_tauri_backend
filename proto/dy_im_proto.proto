  required int64 conversation_short_id = 1;
  required int32 badge_count = 2;
  required int64 conversation_index_v2 = 3;
  required string conversation_id = 4;
  repeated MuteBadgeCountInfo mute_badge_count_infos = 5;
  optional string security_conversation_id = 20;
}

