// ==================== Messages ====================

// ==================== Frame ====================

message Frame {
  required uint64 seqid = 1;
  required uint64 logid = 2;
  required int32 service = 3;
  required int32 method = 4;
  repeated ExtendedEntry headers = 5;
  optional string payload_encoding = 6;
  optional string payload_type = 7;
  optional bytes payload = 8;

  message ExtendedEntry {
    required string key = 1;
    required string value = 2;
  }
}

message MuteReadBadgeCountInfo {
  required int32 message_type = 1;
  required int32 read_badge_count = 2;
}

message MuteBadgeCountInfo {
  required int32 message_type = 1;
  required int32 badge_count = 2;
}

message PropertyItem {
  optional int64 uid = 1;
  optional string sec_uid = 2;
  optional int64 create_time = 3;
  optional string idempotent_id = 4;
  optional string value = 5;
}

message PropertyItemList {
  repeated PropertyItem Items = 1;
}

message ReferenceInfo {
  required int64 referenced_message_id = 1;
  required string hint = 2;
  required int64 ref_message_type = 3;
  required int32 referenced_message_status = 4;
  optional int64 root_message_id = 5;
  optional int64 root_message_conv_index = 6;
  map<string, string> ext = 7;
}

message MessageBody {
  optional string conversation_id = 1;
  optional int32 conversation_type = 2;
  optional int64 server_message_id = 3;
  optional int64 index_in_conversation = 4;
  optional int64 conversation_short_id = 5;
  optional int32 message_type = 6;
  optional int64 sender = 7;
  optional string content = 8;
  map<string, string> ext = 9;
  optional int64 create_time = 10;
  optional int64 version = 11;
  optional int32 status = 12;
  optional int64 order_in_conversation = 13;
  optional string sec_sender = 14;
  map<string, PropertyItemList> property_list = 15;
  map<string, string> user_profile = 16;
  optional int64 index_in_conversation_v2 = 17;
  optional ReferenceInfo reference_info = 18;
  optional int64 index_in_conversation_v1 = 19;
  optional int64 sub_conversation_short_id = 20;
  optional string security_conversation_id = 50;
  optional string security_sender = 51;
}

message Participant {
  optional int64 user_id = 1;
  optional int64 sort_order = 2;
  optional int32 role = 3;
  optional string alias = 4;
  optional string sec_uid = 5;
  optional int32 blocked = 6;
  optional int64 left_block_time = 7;
  map<string, string> ext = 8;
  optional int64 version = 9;
  optional string biz_role = 10;
  optional string group_symbol = 11;
  optional int32 block_source = 20;
  optional string security_user_id = 50;
}

message ParticipantsPage {
  repeated Participant participants = 1;
  optional bool has_more = 2;
  optional int64 cursor = 3;
}

message RobotInfo {
  optional int64 user_id = 1;
  optional string sec_uid = 2;
  map<string, string> ext = 99;
}

message SubConversation {
  optional int64 parent_con_short_id = 1;
  optional int64 sub_con_short_id = 2;
  optional string parent_con_id = 3;
  optional string sub_con_id = 4;
  optional int32 conversation_type = 5;
  optional int32 inbox_type = 6;
  optional int32 status = 7;
  optional string biz_status = 8;
  map<string, string> extra = 9;
  optional int64 create_time = 10;
  optional int64 modify_time = 11;
  optional int64 version = 12;
  optional ParticipantsPage first_page_participants = 100;
  optional string security_parent_con_id = 101;
}

message ConversationCoreInfo {
  optional string conversation_id = 1;
  optional int64 conversation_short_id = 2;
  optional int32 conversation_type = 3;
  optional int64 info_version = 4;
  optional string name = 5;
  optional string desc = 6;
  optional string icon = 7;
  optional int32 inbox_type = 8;
  optional string notice = 9;
  map<string, string> ext = 11;
  optional int64 owner = 12;
  optional string sec_owner = 13;
  optional int32 block_status = 14;
  optional bool block_normal_only = 15;
  optional int32 mode = 16;
  optional int64 creator_uid = 17;
  optional int64 create_time = 18;
  optional string security_conversation_id = 30;
  optional string security_owner = 31;
  optional string security_creator_uid = 32;
  optional int32 block_source = 40;
  optional int64 left_block_time = 41;
}

message ConversationSettingInfo {
  optional string conversation_id = 1;
  optional int64 conversation_short_id = 2;
  optional int32 conversation_type = 3;
  optional int64 min_index = 4;
  optional int64 read_index = 5;
  optional int32 mute = 6;
  optional int32 stick_on_top = 7;
  optional int32 inbox_type = 8;
  map<string, string> ext = 9;
  optional int64 setting_version = 10;
  optional int32 favorite = 11;
  optional int64 set_top_time = 12;
  optional int64 set_favorite_time = 13;
  optional int64 read_index_v2 = 14;
  optional int64 min_index_v2 = 15;
  optional int32 read_badge_count = 16;
  repeated MuteReadBadgeCountInfo mute_read_badge_count_infos = 17;
  optional int64 version = 18;
  optional int32 push_status = 30;
  optional string security_conversation_id = 50;
}

message ConvUnread {
  optional int32 badge_count = 1;
  optional int32 read_badge_count = 2;
}

message ConvUnreadUnion {
  map<int32, ConvUnread> ConvUnreadInfo = 1;
}

message ConversationInfoV2 {
  optional string conversation_id = 1;
  optional int64 conversation_short_id = 2;
  optional int32 conversation_type = 3;
  optional string ticket = 4;
  optional ParticipantsPage first_page_participants = 6;
  optional int32 participants_count = 7;
  optional bool is_participant = 8;
  optional int32 inbox_type = 9;
  optional int32 badge_count = 10;
  repeated MuteBadgeCountInfo mute_badge_count_infos = 11;
  optional int32 status = 12;
  optional int64 version = 13;
  optional Participant user_info = 20;
  optional ConversationCoreInfo conversation_core_info = 50;
  optional ConversationSettingInfo conversation_setting_info = 51;
  optional int64 last_message_indexv2 = 52;
  optional SubConversation current_sub_conv = 53;
  optional string security_conversation_id = 54;
  repeated RobotInfo bots = 60;
  optional ConvUnreadUnion conv_unread_union = 70;
}

message ConversationInfoWithMsg {
  optional string conversation_id = 1;
  optional int64 conversation_short_id = 2;
  optional int32 conversation_type = 3;
  optional string ticket = 4;
  optional ParticipantsPage first_page_participants = 6;
  optional int32 participants_count = 7;
  optional bool is_participant = 8;
  optional int32 inbox_type = 9;
  optional int32 badge_count = 10;
  repeated MuteBadgeCountInfo mute_badge_count_infos = 11;
  optional int32 status = 12;
  optional int64 version = 13;
  optional Participant user_info = 20;
  optional int64 online_member_count = 30;
  optional ConversationCoreInfo conversation_core_info = 50;
  optional ConversationSettingInfo conversation_setting_info = 51;
  optional int64 last_message_indexv2 = 52;
  optional SubConversation current_sub_conv = 53;
  optional string security_conversation_id = 54;
  repeated RobotInfo bots = 60;
  optional ConvUnreadUnion conv_unread_union = 70;
  optional MessageBody last_msg_body = 80;
}

// ==================== Request/Response Bodies ====================

message MessagesPerUserRequestBody {
  optional int64 cursor = 1;
